apiVersion: apps/v1
kind: Deployment
metadata:
  name: curadoria-web
  namespace: curadoria
spec:
  replicas: 1
  selector:
    matchLabels:
      app: curadoria-web
  template:
    metadata:
      labels:
        app: curadoria-web
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: app
          image: curadoria-web:optimized-20260829
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: curadoria-data
