name: Artigo-base (PDF de qualificacao)

on:
  push:
    branches: [main]
    paths:
      - "artigo/artigo_base/main.tex"
      - "artigo/artigo_base/sbc-template.bib"
      - "artigo/artigo_base/sbc.bst"
      - "artigo/artigo_base/figures/**"
      - ".github/workflows/build-artigo-base.yml"
  workflow_dispatch:

concurrency:
  group: artigo-base-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Compilar PDF com BibTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: artigo/artigo_base
          texlive_version: 2026
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Conferir arquivo e referencias
        shell: bash
        run: |
          test -s artigo/artigo_base/main.pdf
          test -s artigo/artigo_base/main.bbl
          if grep -Eq 'LaTeX Warning: There were undefined references|Citation .* undefined|Reference .* undefined' artigo/artigo_base/main.log; then
            echo "O artigo compilou com referencias indefinidas."
            exit 1
          fi

      - name: Verificar que o sumario apareceu no PDF compilado
        shell: bash
        run: |
          test -s artigo/artigo_base/main.toc
          toc_count=$(grep -c '\\contentsline' artigo/artigo_base/main.toc || true)
          echo "Entradas do sumario: $toc_count"
          sed -n '1,8p' artigo/artigo_base/main.toc
          if [ "$toc_count" -lt 20 ]; then
            echo "ERRO: o sumario esta vazio ou incompleto."
            exit 1
          fi

          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils
          fi
          pdftotext -layout -f 3 -l 3 artigo/artigo_base/main.pdf /tmp/artigo-sumario-pagina3.txt
          if ! grep -Eq '1[.]1[[:space:]]' /tmp/artigo-sumario-pagina3.txt; then
            echo "ERRO: subsecoes nao apareceram na pagina inicial do sumario."
            exit 1
          fi
          pdftotext -layout -f 2 -l 6 artigo/artigo_base/main.pdf /tmp/artigo-sumario.txt
          echo "Trecho do sumario efetivamente extraido do PDF:"
          sed -n '1,100p' /tmp/artigo-sumario.txt
          for termo in "Introdu" "Metodologia" "Resultados" "Conclus"; do
            if ! grep -q "$termo" /tmp/artigo-sumario.txt; then
              echo "ERRO: '$termo' nao foi encontrado nas primeiras paginas do PDF."
              exit 1
            fi
          done

      - name: Sincronizar PDF e bibliografia na main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sha_tex_gerado=$(sha256sum artigo/artigo_base/main.tex | cut -d' ' -f1)
          cp artigo/artigo_base/main.pdf /tmp/artigo-qualificacao-compilado.pdf
          cp artigo/artigo_base/main.bbl /tmp/artigo-bibliografia-compilada.bbl
          publicado=false
          for tentativa in 1 2 3 4; do
            git fetch origin main
            sha_tex_atual=$(git show origin/main:artigo/artigo_base/main.tex | sha256sum | cut -d' ' -f1)
            if [ "$sha_tex_gerado" != "$sha_tex_atual" ]; then
              echo "O LaTeX mudou durante a compilacao: nao publicar PDF defasado."
              exit 1
            fi
            git reset --hard origin/main
            cp /tmp/artigo-qualificacao-compilado.pdf artigo/artigo_base/main.pdf
            cp /tmp/artigo-bibliografia-compilada.bbl artigo/artigo_base/main.bbl
            git add artigo/artigo_base/main.pdf artigo/artigo_base/main.bbl
            if git diff --cached --quiet; then
              publicado=true
              break
            fi
            git commit -m "build(artigo): atualiza PDF e bibliografia [skip ci]"
            if git push origin HEAD:main; then
              publicado=true
              break
            fi
            sleep 3
          done
          if [ "$publicado" != true ]; then
            echo "Falha ao sincronizar PDF apos quatro tentativas."
            exit 1
          fi

      - name: Publicar PDF do artigo-base
        uses: actions/upload-artifact@v4
        with:
          name: artigo-base-qualificacao
          path: artigo/artigo_base/main.pdf
          if-no-files-found: error
