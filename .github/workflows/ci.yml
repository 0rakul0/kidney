name: tests

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source without large model payloads
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r curadoria_web/requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Audit versioned curation database
        run: python scripts/audit_curadoria_sqlite.py
      - name: Check pipeline entry points
        run: python -c "import run_pipeline; assert run_pipeline.PIPELINE_SCRIPTS['train'].name == 'train_renal_classifier.py'"
      - name: Report model payload status
        run: python scripts/check_lfs_assets.py
